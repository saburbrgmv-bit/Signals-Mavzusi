{% extends 'base.html' %}
{% block content %}
{% for post in posts %}

  <ul>
    <li>{{ post.title }} <a href="{% url 'update' post.pk %}">Update</a>  <a href="{% url 'delete' post.pk %}">Delete</a></li>
  </ul>
{% endfor %}
{% if user.is_authenticated %}
<a href="{% url 'logout' %}">Log Out</a>
{% else %}
<a href="{% url 'Login'  %}">Login</a>
<a href="{% url 'register'  %}">Register</a>
{% elseif %}
<h3> Welcome {{ post }}</h3>
<a href="{% url 'create' %}">Create</a>
{% endblock %}
