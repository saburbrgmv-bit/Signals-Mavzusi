<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        <h2 class="mb-4 text-center fw-semibold text-dark">User Profiles</h2>

        <div class="row g-4">
          {% for  profile in profiles%}
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 border-0 shadow-sm text-center p-3">
                    <div class="d-flex justify-content-center pt-3">
                        <img src="{{profile.image.url}}"
                             alt="{{profile.user}}"
                             class="rounded-circle border border-2 border-primary-subtle"
                             width="90"
                             height="90"
                             style="object-fit: cover;">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title fw-bold mb-1">@{{profile.user}}</h5>
                        <p class="card-text text-muted small mt-2">{{profile.bio}}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
